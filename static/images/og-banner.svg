<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.04">
    <line x1="0" y1="105" x2="1200" y2="105" stroke="#94a3b8" stroke-width="1"/>
    <line x1="0" y1="210" x2="1200" y2="210" stroke="#94a3b8" stroke-width="1"/>
    <line x1="0" y1="315" x2="1200" y2="315" stroke="#94a3b8" stroke-width="1"/>
    <line x1="0" y1="420" x2="1200" y2="420" stroke="#94a3b8" stroke-width="1"/>
    <line x1="0" y1="525" x2="1200" y2="525" stroke="#94a3b8" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="630" stroke="#94a3b8" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="630" stroke="#94a3b8" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="#94a3b8" stroke-width="1"/>
    <line x1="800" y1="0" x2="800" y2="630" stroke="#94a3b8" stroke-width="1"/>
    <line x1="1000" y1="0" x2="1000" y2="630" stroke="#94a3b8" stroke-width="1"/>
  </g>

  <!-- Accent top bar -->
  <rect x="0" y="0" width="1200" height="5" fill="url(#accent)"/>

  <!-- Left accent block -->
  <rect x="80" y="180" width="5" height="200" fill="url(#accent)" rx="2"/>

  <!-- Main name -->
  <text x="108" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="74" font-weight="700" fill="#f8fafc" letter-spacing="-1">Asger Storgaard</text>
  <text x="108" y="365" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="74" font-weight="700" fill="#f8fafc" letter-spacing="-1">Høffner</text>

  <!-- Domain pill -->
  <rect x="108" y="400" width="310" height="44" rx="22" fill="#1e3a5f" opacity="0.8"/>
  <text x="263" y="428" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#60a5fa" text-anchor="middle" letter-spacing="0.5">storgaardcoding.dk</text>

  <!-- Tagline -->
  <text x="108" y="498" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" fill="#94a3b8" letter-spacing="0.5">Datamatiker · AIDA Portfolio</text>

  <!-- Decorative code brackets top-right -->
  <text x="960" y="280" font-family="'Courier New', monospace" font-size="200" fill="#3b82f6" opacity="0.07" font-weight="700">&lt;/&gt;</text>
</svg>
